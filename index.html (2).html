<title>SKIN AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: sticky header, navy hero band with a viewfinder motif, white working pages with one clear job each. */
:root{
  --navy:#0B2545; --teal-bright:#2CC4BE;
  --bg:#FFFFFF; --surface:#F2F8FA; --card:#FFFFFF; --ink:#0B2545; --muted:#4A6076; --line:#D7E4EA;
  --accent:#0A8383; --accent-ink:#FFFFFF; --accent-soft:#E0F4F3; --accent-text:#0A6F6F;
  --hero-bg:#0B2545; --hero-ink:#FFFFFF; --hero-muted:#BBD3E0; --hero-line:rgba(255,255,255,.28);
  --warn-bg:#FFF4DB; --warn-line:#E7B94A; --warn-ink:#5A4000;
  --ok-bg:#DDF4EE; --ok-ink:#0B5D4F;
  --bad-bg:#FDE7E4; --bad-ink:#8A1F14;
  --shadow:0 10px 30px rgba(11,37,69,.08);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07162B; --surface:#0C1F3A; --card:#0F2745; --ink:#E7F1F5; --muted:#9DB5C6; --line:#1E3C60;
    --accent:#2CC4BE; --accent-ink:#04222A; --accent-soft:#0F3A47; --accent-text:#5FE0DA;
    --hero-bg:#0C2A4F; --hero-ink:#FFFFFF; --hero-muted:#BBD3E0; --hero-line:rgba(255,255,255,.25);
    --warn-bg:#3A2D0B; --warn-line:#8F6D1C; --warn-ink:#F6DFA0;
    --ok-bg:#0D3B35; --ok-ink:#8DE8D2;
    --bad-bg:#43191A; --bad-ink:#FFB4AB;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07162B; --surface:#0C1F3A; --card:#0F2745; --ink:#E7F1F5; --muted:#9DB5C6; --line:#1E3C60;
  --accent:#2CC4BE; --accent-ink:#04222A; --accent-soft:#0F3A47; --accent-text:#5FE0DA;
  --hero-bg:#0C2A4F; --hero-ink:#FFFFFF; --hero-muted:#BBD3E0; --hero-line:rgba(255,255,255,.25);
  --warn-bg:#3A2D0B; --warn-line:#8F6D1C; --warn-ink:#F6DFA0;
  --ok-bg:#0D3B35; --ok-ink:#8DE8D2;
  --bad-bg:#43191A; --bad-ink:#FFB4AB;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em;}
h1{font-size:clamp(2rem,5.2vw,3.3rem);font-weight:700;}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:700;}
h3{font-size:1.15rem;font-weight:600;}
p{margin:0;}
a{color:var(--accent-text);}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
:focus-visible{outline:3px solid var(--teal-bright);outline-offset:2px;}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line);}
.header-row{display:flex;align-items:center;gap:.75rem 1.25rem;flex-wrap:wrap;padding-block:.7rem;}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:1.3rem;letter-spacing:.02em;}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:.7rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:-2px;}
.nav{display:flex;gap:.25rem;margin-left:auto;overflow-x:auto;max-width:100%;}
.nav a{padding:.5rem .85rem;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;}
.nav a:hover{color:var(--ink);background:var(--surface);}
.nav a[aria-current="page"]{color:var(--accent-text);background:var(--accent-soft);}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-width:44px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font:600 .85rem var(--font-body);}
.icon-btn:hover{background:var(--surface);}
@media (max-width:640px){.nav{order:3;width:100%;margin-left:0;}.header-row .icon-btn{margin-left:auto;}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.7rem 1.3rem;border-radius:10px;border:1px solid transparent;font:600 1rem var(--font-body);cursor:pointer;text-decoration:none;transition:transform .15s,background .15s;}
.btn:hover{transform:translateY(-1px);}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{background:var(--surface);}
.btn-hero{background:#2CC4BE;color:#04222A;}
.btn-hero-ghost{background:transparent;color:#fff;border-color:var(--hero-line);}
.btn-hero-ghost:hover{background:rgba(255,255,255,.1);}
.btn-row{display:flex;gap:.75rem;flex-wrap:wrap;}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);padding-block:clamp(2rem,6vw,4.5rem);}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:2.5rem;align-items:center;}
.hero h1{color:var(--hero-ink);}
.hero p.lead{color:var(--hero-muted);font-size:1.12rem;max-width:36rem;margin-top:1rem;}
.hero .btn-row{margin-top:1.6rem;}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .75rem;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--hero-line);color:var(--hero-ink);margin-bottom:1.1rem;}
.dot{width:8px;height:8px;border-radius:50%;background:#F3B73B;display:inline-block;}
.viewfinder{border:1px solid var(--hero-line);border-radius:18px;padding:1.25rem;background:rgba(255,255,255,.04);}
.viewfinder svg{display:block;width:100%;height:auto;max-height:300px;}
.viewfinder figcaption{color:var(--hero-muted);font-size:.9rem;margin-top:.8rem;}
@media (max-width:820px){.hero-grid{grid-template-columns:minmax(0,1fr);}}

/* sections */
.section{padding-block:clamp(2rem,5vw,3.5rem);}
.section.alt{background:var(--surface);}
.section-head{max-width:40rem;margin-bottom:1.6rem;}
.section-head p{color:var(--muted);margin-top:.6rem;}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));}
.grid>*{min-width:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.3rem;}
.card.raised{box-shadow:var(--shadow);}
.card h3{margin-bottom:.5rem;}
.card p,.card li{color:var(--muted);}
.card ul{margin:.4rem 0 0;padding-left:1.15rem;display:grid;gap:.35rem;}
.step-n{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:700;margin-bottom:.7rem;}
.abcde{display:grid;gap:.6rem;margin:.6rem 0 0;padding:0;list-style:none;}
.abcde li{display:flex;gap:.75rem;align-items:baseline;}
.abcde b{font-family:var(--font-display);font-size:1.25rem;color:var(--accent-text);width:1.2rem;flex:none;}
.cta-band{background:var(--hero-bg);color:var(--hero-ink);border-radius:18px;padding:clamp(1.5rem,4vw,2.5rem);display:flex;gap:1.25rem;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.cta-band p{color:var(--hero-muted);margin-top:.4rem;}

/* notices */
.notice{border-radius:12px;padding:.95rem 1.1rem;font-size:.95rem;border:1px solid;}
.notice b{font-weight:700;}
.notice.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink);}
.notice.info{background:var(--accent-soft);border-color:var(--line);color:var(--ink);}
.stack{display:grid;gap:1rem;}

/* analyze */
.page-title{padding-block:clamp(1.5rem,4vw,2.5rem) 1rem;}
.page-title p{color:var(--muted);margin-top:.5rem;max-width:40rem;}
.analyze{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.5rem;align-items:start;padding-bottom:3rem;}
@media (max-width:860px){.analyze{grid-template-columns:minmax(0,1fr);}}
.drop{border:2px dashed var(--line);border-radius:14px;padding:1.6rem 1rem;text-align:center;background:var(--surface);display:grid;gap:.7rem;justify-items:center;transition:border-color .15s,background .15s;}
.drop.over{border-color:var(--accent);background:var(--accent-soft);}
.drop p{color:var(--muted);font-size:.92rem;}
.preview{display:grid;gap:.8rem;}
.preview img{width:100%;max-height:380px;object-fit:contain;border-radius:12px;background:var(--surface);border:1px solid var(--line);}
.meta{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere;}
.check-row{display:flex;gap:.7rem;align-items:flex-start;font-size:.95rem;}
.check-row input{width:20px;height:20px;margin-top:.2rem;accent-color:var(--accent);flex:none;}
.field{display:grid;gap:.35rem;}
.field label{font-weight:600;font-size:.9rem;}
.field input[type="text"],.field input[type="url"]{width:100%;min-height:44px;padding:.6rem .8rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;}
.small{font-size:.85rem;color:var(--muted);}
.empty{display:grid;gap:.5rem;justify-items:start;}
.empty svg{color:var(--accent-text);}
.loader{display:flex;align-items:center;gap:1rem;}
.spinner{width:42px;height:42px;border-radius:50%;border:5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes rise{from{opacity:.0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.reveal{animation:rise .45s ease both;}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s;}.reveal{animation:none;}.btn:hover{transform:none;}}
.badge{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .65rem;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.02em;}
.badge.demo{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink);}
.badge.bad{background:var(--bad-bg);color:var(--bad-ink);}
.badge.live{background:var(--accent-soft);color:var(--accent-text);}
.checks{display:grid;gap:.7rem;margin:.8rem 0 0;padding:0;list-style:none;}
.checks li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .8rem;align-items:start;padding-bottom:.7rem;border-bottom:1px solid var(--line);}
.checks li:last-child{border-bottom:0;padding-bottom:0;}
.checks .tip{grid-column:2;font-size:.88rem;color:var(--muted);}
.checks .val{font-weight:600;overflow-wrap:anywhere;}
.bar-row{margin:.7rem 0;}
.bar-label{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem;margin-bottom:4px;}
.bar-track{height:10px;border-radius:999px;background:var(--surface);overflow:hidden;border:1px solid var(--line);}
.bar-fill{height:100%;background:var(--accent);border-radius:999px;}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;}
footer{border-top:1px solid var(--line);padding-block:1.6rem 2.4rem;color:var(--muted);font-size:.88rem;}
footer .wrap{display:grid;gap:.5rem;}
</style>
